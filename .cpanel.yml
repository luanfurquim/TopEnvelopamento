---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -f index.html $DEPLOYPATH
    - /bin/cp -f robots.txt $DEPLOYPATH 2>/dev/null || true
    - /bin/cp -f .htaccess $DEPLOYPATH 2>/dev/null || true
    - /bin/rm -rf $DEPLOYPATH/assets
    - /bin/cp -R assets $DEPLOYPATH 2>/dev/null || true
